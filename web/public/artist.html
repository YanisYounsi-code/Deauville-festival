<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Artiste du festival</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #25213c; background: #f7f5f0; --purple: #5142a0; --muted: #716d82; --line: #e8e3dc; }
      * { box-sizing: border-box; }
      body { width: min(900px, calc(100% - 40px)); margin: 0 auto; padding: 2rem 0 4rem; }
      .back-link { display: inline-flex; margin-bottom: 1rem; color: var(--purple); font-weight: 750; text-decoration: none; }
      .back-link:hover { transform: translateX(-3px); }
      header {
        position: relative;
        display: flex;
        min-height: 250px;
        align-items: end;
        overflow: hidden;
        padding: clamp(2rem, 7vw, 4rem);
        border: 1px solid #4b4276;
        border-radius: 26px;
        color: white;
        background: radial-gradient(circle at 85% 25%, #8f7ee0 0, transparent 26%), linear-gradient(135deg, #28223f, #51428a 70%, #d26976);
        box-shadow: 0 24px 60px #33295c24;
        isolation: isolate;
      }
      header::after { position: absolute; z-index: -1; right: -50px; bottom: -180px; width: 350px; height: 350px; border: 1px solid #ffffff45; border-radius: 50%; box-shadow: 0 0 0 28px #ffffff0c, 0 0 0 68px #ffffff08; content: ""; }
      .eyebrow { color: #ffc1a8; font-size: .75rem; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
      h1 { margin: .7rem 0 0; font-size: clamp(2.5rem, 7vw, 4.6rem); line-height: 1; letter-spacing: -.065em; }
      #bio { max-width: 560px; margin: 1rem 0 0; color: #e5dff6; line-height: 1.7; }
      h2 { margin: 3rem 0 1rem; font-size: 1.8rem; letter-spacing: -.045em; }
      article { margin: .85rem 0; padding: 1.3rem; border: 1px solid var(--line); border-radius: 18px; background: #fffefa; box-shadow: 0 8px 24px #32274c08; transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease; }
      article:hover { transform: perspective(900px) rotateX(1.5deg) translateY(-3px); border-color: #c9bee9; box-shadow: 0 16px 35px #32274c12; }
      article h3 { margin: 0 0 .5rem; font-size: 1.15rem; }
      article p { line-height: 1.6; }
      .performance-card { display: grid; gap: .65rem; }
      .performance-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: .75rem; }
      .performance-heading h3 { margin: 0; }
      .kind-badge { flex-shrink: 0; padding: .38rem .65rem; border-radius: 999px; color: #5142a0; background: #eeeafd; font-size: .72rem; font-weight: 800; }
      .performance-date { margin: 0; color: #5142a0; font-weight: 800; }
      .performance-venue, .performance-role { margin: 0; color: var(--muted); font-size: .92rem; }
      .performance-role { padding-top: .65rem; border-top: 1px solid var(--line); color: #504c60; }
      .muted, #status { color: var(--muted); }
      #status { min-height: 1.5rem; }
      @media (max-width: 600px) { body { width: min(540px, calc(100% - 28px)); padding-top: 1rem; } header { min-height: 210px; padding: 2rem 1.5rem; border-radius: 22px; } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
    </style>
  </head>
  <body>
    <a class="back-link" href="/">← Retour au programme</a>
    <header>
      <div>
        <span class="eyebrow">À l'affiche</span>
        <h1 id="name">Artiste</h1>
        <p id="bio"></p>
      </div>
    </header>
    <h2>Ses spectacles</h2>
    <p id="status" role="status"></p>
    <main id="performances"></main>
    <script>
      const kindLabels = { solo: "Spectacle solo", lineup: "Plateau d'humour", workshop: "Atelier" };
      const roleLabels = { solo: "Artiste", host: "Maître de cérémonie", teacher: "Intervenant·e", act: "Sur scène" };

      function formatDate(value) {
        return new Intl.DateTimeFormat("fr-FR", {
          weekday: "long", day: "numeric", month: "long",
        }).format(new Date(`${value}T12:00:00`));
      }

      async function loadArtist() {
        const slug = new URLSearchParams(location.search).get("slug");
        const status = document.getElementById("status");
        if (!slug) {
          status.textContent = "Aucun artiste n'a été sélectionné.";
          return;
        }
        try {
          const response = await fetch(`/api/artists/${encodeURIComponent(slug)}`);
          const artist = await response.json();
          if (!response.ok) throw new Error(artist.detail || "Impossible de charger cet artiste.");
          document.title = `${artist.name} | Festival`;
          document.getElementById("name").textContent = artist.name;
          document.getElementById("bio").textContent = artist.bio;
          const performances = document.getElementById("performances");
          for (const performance of artist.performances) {
            const card = document.createElement("article");
            card.className = "performance-card";
            const heading = document.createElement("div");
            heading.className = "performance-heading";
            const title = document.createElement("h3");
            title.textContent = performance.title;
            const kind = document.createElement("span");
            kind.className = "kind-badge";
            kind.textContent = kindLabels[performance.kind] || performance.kind;
            heading.append(title, kind);
            const date = document.createElement("p");
            date.className = "performance-date";
            date.textContent = `${formatDate(performance.festival_day)} · ${performance.start.slice(11)} – ${performance.end.slice(11)}`;
            const venue = document.createElement("p");
            venue.className = "performance-venue";
            venue.textContent = `${performance.venue_name} · ${performance.duration_minutes} min`;
            const role = document.createElement("p");
            role.className = "performance-role";
            role.textContent = performance.artists
              .filter((item) => item.slug === artist.slug)
              .map(() => roleLabels[performance.kind === "solo" ? "solo" : performance.host === artist.slug ? "host" : performance.teacher === artist.slug ? "teacher" : "act"])
              .join(", ");
            card.append(heading, date, venue, role);
            performances.append(card);
          }
          status.textContent = artist.performances.length
            ? `${artist.performances.length} spectacle${artist.performances.length > 1 ? "s" : ""} au programme`
            : "Aucun spectacle n'est programmé.";
        } catch (error) {
          status.textContent = error.message;
        }
      }
      loadArtist();
    </script>
  </body>
</html>
