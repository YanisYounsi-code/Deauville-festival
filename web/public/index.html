<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Deauville Festival du Rire</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        color: #25213c;
        background: #f7f5f0;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        --ink: #25213c;
        --muted: #716d82;
        --purple: #5142a0;
        --coral: #fa7966;
        --line: #e8e3dc;
        --surface: #fffefa;
      }
      * { box-sizing: border-box; }
      body {
        width: min(1120px, calc(100% - 40px));
        margin: 0 auto;
        padding: 2rem 0 4rem;
      }
      header {
        position: relative;
        display: flex;
        min-height: 330px;
        align-items: center;
        justify-content: space-between;
        gap: 2rem;
        overflow: hidden;
        padding: clamp(2rem, 7vw, 5rem);
        border: 1px solid #4b4276;
        border-radius: 28px;
        color: white;
        background:
          radial-gradient(ellipse at 75% 10%, #725fbb 0, transparent 34%),
          linear-gradient(125deg, #292442 5%, #413675 62%, #55458f);
        box-shadow: 0 26px 70px #33295c24;
        isolation: isolate;
      }
      header::before {
        position: absolute;
        z-index: -1;
        right: -100px;
        bottom: -230px;
        width: 500px;
        height: 500px;
        border: 1px solid #ffffff26;
        border-radius: 50%;
        box-shadow: 0 0 0 38px #ffffff08, 0 0 0 92px #ffffff06;
        content: "";
      }
      header p { margin: 1rem 0 0; color: #ded9f4; }
      h1 { max-width: 620px; margin: .5rem 0 0; font-size: clamp(2.5rem, 6vw, 5rem); line-height: .98; letter-spacing: -.065em; }
      .eyebrow { color: #ffc1a8; font-size: .75rem; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
      .hero-art { position: relative; width: 220px; height: 200px; flex: 0 0 220px; perspective: 700px; }
      .hero-ticket {
        position: absolute;
        top: 28px;
        left: 24px;
        display: grid;
        width: 165px;
        height: 128px;
        place-content: center;
        border: 1px solid #ffffff85;
        border-radius: 18px;
        background: linear-gradient(145deg, #ffaf83, #f36f69 68%, #dd5579);
        box-shadow: 0 25px 45px #17112e70, inset 0 1px #ffffffb3;
        color: #32234b;
        text-align: center;
        transform: rotateY(-18deg) rotateX(9deg) rotateZ(7deg);
        animation: ticket-float 5s ease-in-out infinite;
      }
      .hero-ticket strong { font-size: 2rem; letter-spacing: -.08em; }
      .hero-ticket span { margin-top: .25rem; font-size: .65rem; font-weight: 800; letter-spacing: .2em; }
      .hero-orbit { position: absolute; inset: 4px -8px; border: 1px solid #ffffff46; border-radius: 50%; transform: rotate(-26deg) rotateX(62deg); }
      .hero-orbit::after { position: absolute; top: 16px; right: 20px; width: 11px; height: 11px; border-radius: 50%; background: #ffc78a; box-shadow: 0 0 20px #ffc78a; content: ""; }
      .admin-link {
        position: relative;
        z-index: 1;
        flex-shrink: 0;
        padding: .9rem 1.2rem;
        border: 1px solid #ffffff70;
        border-radius: 999px;
        color: #302d55;
        background: white;
        font-weight: 750;
        text-decoration: none;
        transition: transform .2s ease, box-shadow .2s ease;
      }
      .admin-link:hover, .admin-link:focus-visible { box-shadow: 0 10px 28px #17112e55; transform: translateY(-3px); }
      section { margin-top: 3.5rem; }
      .section-heading { display: flex; align-items: end; justify-content: space-between; gap: 1rem; }
      h2 { margin: 0 0 1.1rem; font-size: clamp(1.5rem, 3vw, 2rem); letter-spacing: -.045em; }
      button, select {
        padding: .7rem .95rem;
        border: 1px solid #ddd7e8;
        border-radius: 12px;
        color: var(--ink);
        background: var(--surface);
        font: inherit;
      }
      button { cursor: pointer; transition: color .2s ease, background .2s ease, transform .2s ease, border-color .2s ease; }
      button:hover { border-color: #9f95ca; transform: translateY(-2px); }
      button[aria-pressed="true"] { border-color: var(--purple); color: white; background: var(--purple); box-shadow: 0 7px 18px #5142a02b; }
      .days, .filters, .artist-grid { display: flex; flex-wrap: wrap; gap: .65rem; }
      .filters { align-items: center; margin: 1.25rem 0; color: var(--muted); font-size: .9rem; font-weight: 700; }
      .cards { display: grid; gap: 1rem; }
      #now-playing { grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); }
      #programme { grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); }
      .card, .artist {
        padding: 1.25rem;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--surface);
        box-shadow: 0 8px 24px #32274c08;
        transition: border-color .25s ease, box-shadow .25s ease, transform .25s ease;
      }
      .card:hover, .artist:hover { border-color: #c9bee9; box-shadow: 0 18px 38px #32274c12; transform: perspective(900px) rotateX(1.5deg) translateY(-4px); }
      .card h3 { margin: 0 0 .5rem; font-size: 1.15rem; letter-spacing: -.025em; }
      .card p { line-height: 1.6; }
      .show-card { display: grid; gap: 1rem; }
      .show-topline, .show-meta, .show-footer { display: flex; align-items: center; justify-content: space-between; gap: .75rem; }
      .show-topline { align-items: flex-start; }
      .show-topline h3 { margin: 0; }
      .show-kind, .show-badge { display: inline-flex; align-items: center; border-radius: 999px; font-size: .72rem; font-weight: 800; letter-spacing: .04em; }
      .show-kind { padding: .4rem .65rem; color: #5142a0; background: #eeeafd; white-space: nowrap; }
      .show-badge { padding: .38rem .6rem; color: #8e473c; background: #fff0e8; }
      .show-date { margin: 0; color: var(--purple); font-size: .9rem; font-weight: 800; }
      .show-meta { justify-content: flex-start; color: var(--muted); font-size: .9rem; }
      .show-meta span { display: inline-flex; align-items: center; gap: .4rem; }
      .show-meta span + span::before { margin-right: .35rem; color: #c4bdce; content: "·"; }
      .show-cast { margin: 0; padding-top: .85rem; border-top: 1px solid var(--line); color: #555166; font-size: .9rem; }
      .show-cast strong { color: var(--ink); }
      .show-summary { margin: 0; color: var(--muted); font-size: .9rem; }
      .section-note { margin: -.6rem 0 1rem; color: var(--muted); font-size: .92rem; }
      .muted { color: var(--muted); }
      a { color: var(--purple); }
      .artist-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr)); }
      .artist { min-height: 76px; }
      .artist a { display: flex; min-height: 42px; align-items: center; font-weight: 750; text-decoration: none; }
      .artist a:hover { color: #c94f66; }
      #status { min-height: 1.5rem; color: var(--muted); }
      @keyframes ticket-float {
        0%, 100% { transform: rotateY(-18deg) rotateX(9deg) rotateZ(7deg) translateY(0); }
        50% { transform: rotateY(-12deg) rotateX(4deg) rotateZ(4deg) translateY(-9px); }
      }
      @media (max-width: 650px) {
        body { width: min(540px, calc(100% - 28px)); padding-top: 14px; }
        header { min-height: 0; align-items: flex-start; flex-direction: column; gap: 1.5rem; padding: 2rem 1.5rem; border-radius: 22px; }
        .hero-art { position: absolute; right: -46px; bottom: 12px; opacity: .7; transform: scale(.78); transform-origin: bottom right; }
        .admin-link { align-self: flex-start; }
        section { margin-top: 2.5rem; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <span class="eyebrow">Le rendez-vous du rire</span>
        <h1 id="festival-name">Deauville Festival du Rire</h1>
        <p id="festival-dates"></p>
      </div>
      <a class="admin-link" href="/admin/">Gérer le festival <span aria-hidden="true">↗</span></a>
      <div class="hero-art" aria-hidden="true">
        <div class="hero-orbit"></div>
        <div class="hero-ticket"><strong>RIRE!</strong><span>DEAUVILLE · 2027</span></div>
      </div>
    </header>
    <section aria-labelledby="now-heading">
      <div class="section-heading"><h2 id="now-heading">En ce moment</h2><span class="show-kind">EN DIRECT</span></div>
      <div id="now-playing" class="cards"></div>
    </section>
    <section aria-labelledby="programme-heading">
      <h2 id="programme-heading">Le programme</h2>
      <p class="section-note">Les spectacles, horaires et artistes du festival.</p>
      <div id="days" class="days" aria-label="Jours du festival"></div>
      <div class="filters">
        <label for="venue-filter">Lieu</label>
        <select id="venue-filter"><option value="">Tous les lieux</option></select>
      </div>
      <p id="status" role="status"></p>
      <div id="programme" class="cards"></div>
    </section>
    <section aria-labelledby="artists-heading">
      <h2 id="artists-heading">Les artistes</h2>
      <div id="artists" class="artist-grid"></div>
    </section>
    <script>
      const byId = (id) => document.getElementById(id);
      const state = { day: "", venue: "" };
      const kindLabels = { solo: "Spectacle solo", lineup: "Plateau d'humour", workshop: "Atelier" };

      function formatDate(value, options = { weekday: "long", day: "numeric", month: "long" }) {
        return new Intl.DateTimeFormat("fr-FR", options).format(new Date(`${value}T12:00:00`));
      }

      function card(performance) {
        const article = document.createElement("article");
        article.className = "card show-card";
        const top = document.createElement("div");
        top.className = "show-topline";
        const title = document.createElement("h3");
        title.textContent = performance.title;
        const kind = document.createElement("span");
        kind.className = "show-kind";
        kind.textContent = kindLabels[performance.kind] || performance.kind;
        top.append(title, kind);

        const date = document.createElement("p");
        date.className = "show-date";
        date.textContent = `${formatDate(performance.festival_day)} · ${performance.start.slice(11)} – ${performance.end.slice(11)}`;

        const venue = document.createElement("div");
        venue.className = "show-meta";
        const venueName = document.createElement("span");
        venueName.textContent = performance.venue_name;
        const duration = document.createElement("span");
        duration.textContent = `${performance.duration_minutes} min`;
        venue.append(venueName, duration);
        article.append(top, date, venue);

        const castNames = performance.kind === "lineup"
          ? performance.artists.filter((artist) => artist.slug !== performance.host).map((artist) => artist.name)
          : performance.artists.map((artist) => artist.name);
        if (castNames.length) {
          const cast = document.createElement("p");
          cast.className = "show-cast";
          const label = document.createElement("strong");
          label.textContent = performance.kind === "workshop" ? "Avec " : performance.kind === "lineup" ? "Au plateau : " : "Avec ";
          cast.append(label, document.createTextNode(castNames.join(", ")));
          article.append(cast);
        }

        const badges = [];
        if (performance.kind === "solo" && performance.min_age > 0) {
          badges.push(`À partir de ${performance.min_age} ans`);
        } else if (performance.kind === "workshop") {
          badges.push(`${performance.places_left} places disponibles`);
        }
        if (performance.description) {
          const summary = document.createElement("p");
          summary.className = "show-summary";
          summary.textContent = performance.description;
          article.append(summary);
        }
        for (const badge of badges) {
          const label = document.createElement("span");
          label.className = "show-badge";
          label.textContent = badge;
          article.append(label);
        }
        return article;
      }

      async function getJson(path) {
        const response = await fetch(path);
        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.detail || `Request failed (${response.status})`);
        }
        return response.json();
      }

      async function loadProgramme() {
        const query = new URLSearchParams();
        if (state.day) query.set("day", state.day);
        if (state.venue) query.set("venue", state.venue);
        byId("status").textContent = "Chargement du programme…";
        try {
          const performances = await getJson(`/api/programme?${query}`);
          const target = byId("programme");
          target.replaceChildren(...performances.map(card));
          byId("status").textContent = performances.length
            ? `${performances.length} spectacle${performances.length > 1 ? "s" : ""} au programme`
            : "Aucun spectacle pour cette sélection.";
        } catch (error) {
          byId("status").textContent = error.message;
        }
      }

      async function start() {
        try {
          const [festival, venues, artists] = await Promise.all([
            getJson("/api/festival"),
            getJson("/api/venues"),
            getJson("/api/artists"),
          ]);
          byId("festival-name").textContent = festival.name;
          byId("festival-dates").textContent = `Du ${formatDate(festival.first_day, { weekday: "long", day: "numeric", month: "long" })} au ${formatDate(festival.last_day, { weekday: "long", day: "numeric", month: "long", year: "numeric" })}`;
          state.day = festival.days[0];
          for (const day of festival.days) {
            const button = document.createElement("button");
            button.textContent = formatDate(day, { weekday: "short", day: "numeric", month: "short" });
            button.setAttribute("aria-label", formatDate(day));
            button.setAttribute("aria-pressed", day === state.day);
            button.addEventListener("click", () => {
              state.day = day;
              for (const item of byId("days").children) {
                item.setAttribute("aria-pressed", String(item.textContent === day));
              }
              loadProgramme();
            });
            byId("days").append(button);
          }
          for (const venue of venues) {
            const option = document.createElement("option");
            option.value = venue.slug;
            option.textContent = venue.name;
            byId("venue-filter").append(option);
          }
          byId("venue-filter").addEventListener("change", (event) => {
            state.venue = event.target.value;
            loadProgramme();
          });
          for (const artist of artists) {
            const item = document.createElement("article");
            item.className = "artist";
            const link = document.createElement("a");
            link.href = `/artist.html?slug=${encodeURIComponent(artist.slug)}`;
            link.textContent = artist.name;
            item.append(link);
            byId("artists").append(item);
          }
          await loadProgramme();
          const queryAt = new URLSearchParams(location.search).get("at");
          const nowPath = queryAt
            ? `/api/now?at=${encodeURIComponent(queryAt)}`
            : "/api/now";
          const now = await getJson(nowPath);
          const nowCards = byId("now-playing");
          if (now.now_playing.length) {
            nowCards.replaceChildren(...now.now_playing.map(card));
          } else {
            nowCards.textContent = "Aucun spectacle en cours.";
          }
          if (queryAt) {
            const nowDay = now.now_playing[0]?.festival_day || queryAt.slice(0, 10);
            if (festival.days.includes(nowDay)) {
              state.day = nowDay;
              for (const button of byId("days").children) {
                button.setAttribute("aria-pressed", String(button.textContent === nowDay));
              }
              await loadProgramme();
            }
          }
        } catch (error) {
          byId("status").textContent = error.message;
        }
      }
      start();
    </script>
  </body>
</html>
